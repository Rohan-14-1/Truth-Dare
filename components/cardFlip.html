<!-- cardFlip.html — Card flip component template reference -->
<!-- Rendered by UI.renderQuestion() into #game-main-content -->
<!--
  Structure:
  .flip-card-container (perspective wrapper)
    .flip-card (transform container, toggles .flipped class)
      .flip-card-front : Shows type icon and "Tap to reveal"
      .flip-card-back  : Shows the actual question
        .flip-card-meta     : Type, difficulty, pack labels
        .flip-card-question : The question text
  
  Behavior:
  - Clicking the card adds .flipped class (CSS 3D transform)
  - After flip, vote buttons and skip option appear
  - For dares, timer starts automatically after reveal
-->
