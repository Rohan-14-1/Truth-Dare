<!-- lobby.html — Lobby component template reference -->
<!-- This component is rendered inline in index.html #lobby-screen -->
<!-- Structure: Player name input, player tag list, start/settings buttons -->
<!--
  Elements:
  - #player-name-input : Text input for player names
  - #btn-add-player    : Adds the typed name as a player
  - #player-list       : Container for rendered player tags
  - #btn-start-game    : Starts the game (disabled until 2+ players)
  - #btn-open-settings : Opens the settings modal
  
  Each player tag contains:
  - .avatar            : Colored circle with initials
  - .player-remove     : X button to remove the player
-->
